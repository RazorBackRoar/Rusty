name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: macos-latest
    steps:
      - name: Checkout Rusty
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Verify release bundle contract
        run: zsh scripts/release-preflight.zsh --allow-other-root --check-config-only

      - name: Clippy
        run: cargo clippy --workspace

      - name: Tests
        run: cargo test --workspace
